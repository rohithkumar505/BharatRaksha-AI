# Bharat Raksha AI — full stack on Render (Docker web + managed Postgres)
# Deploy: connect repo at https://dashboard.render.com → New Blueprint

databases:
  - name: bharatraksha-db
    plan: free
    databaseName: bharatraksha
    user: bharatraksha

services:
  - type: web
    name: bharatraksha-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bharatraksha-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXTAUTH_URL
        sync: false
      - key: REDIS_HOST
        value: ""
      - key: REDIS_URL
        value: ""
      - key: S3_ENDPOINT
        value: ""
      - key: S3_ACCESS_KEY
        value: placeholder
      - key: S3_SECRET_KEY
        value: placeholder
      - key: S3_BUCKET
        value: evidence
      - key: ENABLE_INGESTION_WORKER
        value: "false"
      - key: AI_SERVICE_URL
        value: ""
